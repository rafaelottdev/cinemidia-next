name: CI Pipeline

on:
  pull_request:
    branches: 
      - main

jobs:
  build_and_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Run Postman tests
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: "collection run ./src/tests/postman/collections/cinemidia --environment ./src/tests/postman/environments/url-variables.environment.yaml"
